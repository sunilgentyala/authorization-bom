[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authorization-bom"
version = "0.1.0"
description = "ABOM: a portable authorization evidence manifest format and reference tooling (schema, generator, validator, effective-permission/delegation/drift/toxic-combination analysis, signing, and reporting)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sunil Gentyala" },
]
keywords = ["authorization", "security", "identity", "ai-agents", "mcp", "sbom", "policy-as-code", "zero-trust", "access-control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "hypothesis>=6.100",
]

[project.scripts]
authbom = "authbom.cli:main"

[project.urls]
Homepage = "https://github.com/sunilgentyala/authorization-bom"
Repository = "https://github.com/sunilgentyala/authorization-bom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authbom = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
